<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso de operaciones combinadas · 4.º de Primaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a44;--soft:#5b6884;--grid:#dbe7f2;--paper:#f9fbfd;--card:#ffffff;--line:#a9bdd1;
  --p:#7a4cc2;--p-bg:#f1eafb;--x:#d06a06;--x-bg:#fdf0e1;--s:#178a6b;--s-bg:#e3f4ee;
  --red:#c93626;--red-bg:#fbe8e5;--blue:#2453a6;--blue-bg:#e8eff9;--gold:#e0a400;
  --shadow:#1d2a44;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8eef8;--soft:#a3b0c8;--grid:#1f2a3d;--paper:#121a28;--card:#1a2436;--line:#3a4a63;
    --p:#b393ee;--p-bg:#2b2340;--x:#f2a14d;--x-bg:#3a2a18;--s:#4cc59f;--s-bg:#163329;
    --red:#ff7a6b;--red-bg:#3c1f1c;--blue:#8fb2ff;--blue-bg:#1c2a45;--gold:#ffcc4d;--shadow:#000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8eef8;--soft:#a3b0c8;--grid:#1f2a3d;--paper:#121a28;--card:#1a2436;--line:#3a4a63;
  --p:#b393ee;--p-bg:#2b2340;--x:#f2a14d;--x-bg:#3a2a18;--s:#4cc59f;--s-bg:#163329;
  --red:#ff7a6b;--red-bg:#3c1f1c;--blue:#8fb2ff;--blue-bg:#1c2a45;--gold:#ffcc4d;--shadow:#000;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:Andika,"Comic Neue","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100%}
h1,h2,h3,.f{font-family:Fredoka,"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:600;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.cp{color:var(--p)}.cx{color:var(--x)}.cs{color:var(--s)}
b.cp,b.cx,b.cs{font-weight:700}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top .back{border:2px solid var(--ink);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl small{display:block;color:var(--soft);font-size:14px}
.top .ttl h2{font-size:21px}
.bar{height:10px;border-radius:6px;background:var(--grid);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--s);border-radius:6px;transition:width .4s}

/* home */
.hero{padding:10px 0 22px}
.hero .k{color:var(--blue);font-family:Fredoka;font-weight:600;font-size:15px}
.hero h1{font-size:clamp(34px,8vw,48px);margin:6px 0 10px}
.hero p{color:var(--soft);margin:0;max-width:34em}
.eq{margin:22px 0 6px;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--shadow);padding:16px 18px}
.eq p{margin:0 0 6px;font-size:16px}
.eq .big{font-family:Andika,system-ui,sans-serif;font-weight:700;font-size:clamp(28px,8vw,40px);text-align:center}
details.fam{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:22px 0}
details.fam summary{font-family:Fredoka;font-weight:600;cursor:pointer;font-size:18px}
details.fam p,details.fam li{font-size:16px;color:var(--soft)}
.path{position:relative;margin-top:8px;padding-left:4px}
.path::before{content:"";position:absolute;left:31px;top:30px;bottom:30px;border-left:4px dashed var(--line)}
.lv{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:8px 0}
.lv .dot{flex:none;width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:600;font-size:26px;color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.lv .info{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.lv .info b{font-family:Fredoka;font-weight:600;font-size:18px;display:block}
.lv .info span{font-size:14px;color:var(--soft)}
.lv .stars{font-size:18px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.lv.locked{opacity:.5;cursor:not-allowed}
.lv.locked .dot{background:var(--soft)!important}
.lv .dot svg.lk{width:30px;height:34px}
.lv:not(.locked):hover .info{border-color:var(--ink)}
.reset{margin-top:26px;background:none;border:0;color:var(--soft);text-decoration:underline;font-size:14px}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 18px 20px;margin-bottom:16px}
.card h3{font-size:22px;margin-bottom:10px}
.card .q{margin:0 0 12px}
.kind{display:inline-block;font-family:Fredoka;font-weight:600;font-size:14px;border-radius:8px;padding:2px 10px;margin-bottom:8px;background:var(--blue-bg);color:var(--blue)}
.ladder{display:grid;gap:8px;margin:6px 0 4px}
.rung{display:flex;align-items:center;gap:14px;border-radius:12px;padding:10px 14px}
.rung .sym{font-family:Fredoka;font-weight:600;font-size:26px;width:44px;text-align:center;flex:none}
.rung small{display:block;font-family:Fredoka;font-weight:600;font-size:14px}
.steps5{display:grid;gap:10px;margin:4px 0;padding:0;list-style:none;counter-reset:s}
.steps5 li{display:flex;gap:12px;align-items:flex-start}
.steps5 li::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--s);color:#fff;font-family:Fredoka;font-weight:600;display:flex;align-items:center;justify-content:center}
.pistas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pistas div{border-radius:12px;padding:10px;font-size:15px}
.pistas .sym{font-family:Fredoka;font-weight:600;font-size:28px;line-height:1}
@media (max-width:520px){.pistas{grid-template-columns:1fr}}
.note{border-left:6px solid var(--x);background:var(--x-bg);border-radius:0 12px 12px 0;padding:10px 14px;font-size:16px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.mini{border-radius:14px;padding:12px;border:2px solid var(--line)}

/* tree */
.treebox{position:relative;overflow-x:auto;padding:6px 2px 4px;margin:4px 0 8px}
.tree{position:relative;min-width:max-content;margin:0 auto;padding:0 10px}
.tree svg.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.trow{display:flex;justify-content:center;align-items:center;gap:2px;height:44px;margin-bottom:26px;transition:transform .25s}
.trow:last-child{margin-bottom:0}
.tk{font-weight:700;font-size:27px;padding:0 3px;border-radius:8px;line-height:1.2}
.tk.par{padding:0 1px}
button.tk{background:var(--card);border:2px dashed var(--line);padding:0 8px;min-width:40px;min-height:40px}
button.tk:hover{border-color:var(--ink)}
.tk.on-p{background:var(--p-bg);color:var(--p)} .tk.on-x{background:var(--x-bg);color:var(--x)} .tk.on-s{background:var(--s-bg);color:var(--s)}
.tk.res-p{color:var(--p)}.tk.res-x{color:var(--x)}.tk.res-s{color:var(--s)}
.tk.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center;margin-top:8px}
.ask .f{font-size:22px}
input.num{font:inherit;font-weight:700;font-size:24px;width:96px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px;background:var(--card);color:var(--ink)}
.btn{border:3px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 20px;font-family:Fredoka;font-weight:600;font-size:18px;box-shadow:3px 3px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.fb{border-radius:12px;padding:10px 14px;margin-top:12px;font-size:16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--s-bg);color:var(--ink);border-left:6px solid var(--s)}
.fb.bad{background:var(--red-bg);color:var(--ink);border-left:6px solid var(--red)}
.fb.tip{background:var(--blue-bg);color:var(--ink);border-left:6px solid var(--blue)}
.navrow{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.choice{display:grid;gap:10px}
.choice button{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:20px}
.choice button.right{border-color:var(--s);background:var(--s-bg)}
.choice button.wrong{border-color:var(--red);background:var(--red-bg)}
.vf{display:flex;gap:12px;justify-content:center}
.vf button{min-width:120px}
.bigexpr{font-weight:700;font-size:27px;text-align:center;margin:6px 0 14px;letter-spacing:.5px}
.slot{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:3px solid var(--ink);border-radius:10px;background:var(--card);font-weight:700;font-size:26px;vertical-align:middle;margin:0 2px}
.slot.empty{color:var(--soft)}
.ptok{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:27px;padding:0 3px}
button.ptok{border:2px dashed var(--line);border-radius:10px;background:var(--card);min-width:40px;min-height:44px;margin:0 2px}
button.ptok.sel{border-color:var(--p);background:var(--p-bg)}
.pp{color:var(--p);font-weight:700;font-size:30px}
.sentence{font-size:19px;line-height:2.1}
.sentence button{background:none;border:0;border-bottom:3px dotted var(--line);padding:0 2px;font-size:19px}
.sentence button.sel{background:var(--x-bg);border-bottom-color:var(--x)}
.sentence button.miss{background:var(--red-bg)}
.faces{display:grid;gap:10px}
.faces button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px}
.faces button.sel{border-color:var(--ink);background:var(--blue-bg)}
.faces .em{font-size:28px}
.end{text-align:center;padding:26px 18px}
.end .st{font-size:46px;letter-spacing:6px;color:var(--gold);margin:8px 0}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.foot{color:var(--soft);font-size:13px;text-align:center;margin-top:30px}
/* ===== pixel / block theme ===== */
:root{--px:"Pixelify Sans","Courier New",monospace;--bev:inset 3px 3px 0 rgba(255,255,255,.28),inset -3px -3px 0 rgba(0,0,0,.28)}
body{background-size:24px 24px}
h1,h2,h3,.f,.btn,.kind,.lv .dot,.rung small,.top .ttl small,.hero .k,details.fam summary,.lv .info b,.pistas .sym,.rung .sym{font-family:var(--px);font-weight:700;letter-spacing:.3px}
.card,.btn,.choice button,.lv .info,details.fam,.eq,.slot,button.tk,button.ptok,.mini,.rung,.pistas div,.fb,.note,input.num,.top .back,.faces button,.tk,.kind,.bar,.bar i,.lv .dot,.sentence button{border-radius:0!important}
.card{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--line)}
.eq{box-shadow:8px 8px 0 var(--shadow)}
.btn{box-shadow:var(--bev),4px 4px 0 var(--line);transition:transform .05s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:var(--bev)}
.btn.ghost{box-shadow:inset -3px -3px 0 var(--grid),4px 4px 0 var(--line)}
button.tk,button.ptok,.slot{box-shadow:inset -3px -3px 0 var(--grid)}
.choice button,.faces button{border-width:3px;box-shadow:inset -4px -4px 0 var(--grid)}
.kind{border:2px solid currentColor}
.bar{height:14px;border:2px solid var(--ink);background:var(--card)}
.bar i{background:repeating-linear-gradient(90deg,var(--s) 0 14px,transparent 14px 17px);border-radius:0}
.lv .dot{width:60px;height:60px;box-shadow:var(--bev),4px 4px 0 var(--shadow);font-size:28px}
.lv .info{border-width:3px}
.path::before{border-left:6px dotted var(--line);left:30px}
.top .back{box-shadow:var(--bev);border-width:3px}
.rung{border-left:8px solid currentColor}
.note{border-left-width:8px}
.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.hero .ptree{width:clamp(84px,24vw,128px);image-rendering:pixelated;transform-origin:50% 100%;animation:grow .9s steps(6) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hero .eq,.hero p,.hero .k,.hero h1{grid-column:1/-1}
.hero .titlebox{grid-column:1}
.gems{display:inline-flex;gap:3px;vertical-align:middle}
.gems svg{width:20px;height:20px}
.end .gems svg{width:46px;height:46px}
.end .st{display:flex;justify-content:center}
svg.pix{shape-rendering:crispEdges}
.tree svg.lines line{stroke-linecap:square}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
"use strict";
const M='−', X='×';
const COLORS={p:'var(--p)',x:'var(--x)',s:'var(--s)'};
const app=document.getElementById('app');
const KEY='repaso-oc-4p-v1';

/* ---------- storage ---------- */
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=load()||{unlocked:1,stars:{}};
if(typeof state.unlocked!=='number')state={unlocked:1,stars:{}};

/* ---------- maths ---------- */
function tok(s){return s.replace(/\(/g,' ( ').replace(/\)/g,' ) ').trim().split(/\s+/)}
const isOp=t=>t==='+'||t===M||t===X;
function nextOp(t){
  const r=t.indexOf(')');let lo=0,hi=t.length-1,inP=false;
  if(r>=0){let l=t.lastIndexOf('(',r);lo=l+1;hi=r-1;inP=true}
  let first=-1;
  for(let i=lo;i<=hi;i++){if(t[i]===X){first=i;break}}
  if(first<0)for(let i=lo;i<=hi;i++){if(t[i]==='+'||t[i]===M){first=i;break}}
  const kind=inP?'p':(t[first]===X?'x':'s');
  return {i:first,kind,inP,lo,hi};
}
function calc(a,op,b){a=+a;b=+b;return op==='+'?a+b:op===M?a-b:a*b}
function apply(t,i){
  const v=calc(t[i-1],t[i],t[i+1]);
  let nt=t.slice(0,i-1).concat([String(v)],t.slice(i+2));let ri=i-1;
  if(nt[ri-1]==='('&&nt[ri+1]===')'){nt=nt.slice(0,ri-1).concat([nt[ri]],nt.slice(ri+2));ri--}
  return {nt,ri,v};
}
function evalT(t){t=t.slice();let guard=0;
  while(t.length>1&&guard++<50){const n=nextOp(t);if(n.i<0)return NaN;t=apply(t,n.i).nt}
  return +t[0]}
function evalS(s){try{return evalT(tok(s))}catch(e){return NaN}}
function nice(s){return s.replace(/\( /g,'(').replace(/ \)/g,')')}
function stepsText(s){let t=tok(s);const out=[nice(t.join(' '))];
  while(t.length>1){t=apply(t,nextOp(t).i).nt;out.push(nice(t.join(' ')))}return out.join(' = ')}
function color(s){return s.replace(/[()]/g,m=>`<b class="cp">${m}</b>`).replace(/×/g,'<b class="cx">×</b>').replace(/(\s)([+−])(\s)/g,'$1<b class="cs">$2</b>$3')}

/* ---------- content ---------- */
const LADDER=`<div class="ladder">
<div class="rung" style="background:var(--p-bg)"><span class="sym cp">( )</span><div><small class="cp">Primero</small><b>Los paréntesis</b>, si los hay.</div></div>
<div class="rung" style="background:var(--x-bg)"><span class="sym cx">×</span><div><small class="cx">Después</small><b>Las multiplicaciones</b>, de izquierda a derecha.</div></div>
<div class="rung" style="background:var(--s-bg)"><span class="sym cs">+ −</span><div><small class="cs">Al final</small><b>Las sumas y las restas</b>, de izquierda a derecha.</div></div></div>`;

const LEVELS=[
{n:1,c:'var(--blue)',title:'Recuerda el orden',sub:'Teoría y primeros pasos',items:[
 {type:'theory',kind:'Recuerda',title:'¿Qué va primero?',html:`<p class="q">Antes de calcular, mira <b>toda</b> la operación y decide qué va primero.</p>${LADDER}
 <p class="q" style="margin-top:12px">Lo resolvemos con el <b>arbolito</b>: unimos con dos ramitas los números que operamos, escribimos el resultado debajo y copiamos el resto igual.</p>`},
 {type:'demo',expr:`20 ${M} 3 ${X} 4 + 5`,title:'Mira cómo se hace',text:'Pulsa «Siguiente paso» y observa cómo crece el arbolito.'},
 {type:'demo',expr:`4 ${X} (10 ${M} 7) + 2 ${X} 3`,title:'Ahora con paréntesis',text:'Primero el paréntesis, después las multiplicaciones y al final la suma.'},
 {type:'firstop',expr:`9 + 2 ${X} 4`},
 {type:'firstop',expr:`(9 + 2) ${X} 4`},
 {type:'firstop',expr:`12 ${M} 5 + 3`},
]},
{n:2,c:'var(--x)',title:'Arbolito sin paréntesis',sub:'Multiplicaciones antes que sumas y restas',items:[
 {type:'theory',kind:'Cómo funciona',title:'Ahora lo haces tú',html:`<p class="q">En cada paso:</p><ol class="steps5"><li>Toca la operación que va primero.</li><li>Escribe el resultado.</li><li>El arbolito baja una fila. ¡Sigue hasta el final!</li></ol><p class="note">Si te equivocas de operación, te daremos una pista.</p>`},
 {type:'tree',expr:`15 ${M} 6 + 4`},{type:'tree',expr:`6 ${X} 4 ${M} 9`},{type:'tree',expr:`8 + 2 ${X} 7 ${M} 10`},{type:'tree',expr:`3 ${X} 6 + 4 ${X} 2`},
]},
{n:3,c:'var(--p)',title:'Arbolito con paréntesis',sub:'Siempre empezamos por dentro',items:[
 {type:'tree',expr:`(14 ${M} 6) ${X} 3`},{type:'tree',expr:`5 ${X} (12 ${M} 9) + 7`},{type:'tree',expr:`50 ${M} (4 + 6) ${X} 3`},{type:'tree',expr:`2 ${X} (3 + 5) ${M} 4 ${X} 2`},
]},
{n:4,c:'var(--p)',title:'Piensa y corrige',sub:'Verdadero o falso, paréntesis y signos',items:[
 {type:'vf',claim:`7 + 3 ${X} 2 = 20`},{type:'vf',claim:`(7 + 3) ${X} 2 = 20`},{type:'vf',claim:`18 ${M} 4 ${X} 2 = 28`},{type:'vf',claim:`30 ${M} (5 + 5) = 20`},
 {type:'paren',expr:`4 + 2 ${X} 5`,target:30},{type:'paren',expr:`18 ${M} 6 ${M} 2`,target:14},{type:'paren',expr:`3 ${X} 8 ${M} 5`,target:9},{type:'paren',expr:`20 ${M} 4 + 6`,target:10},
 {type:'signs',parts:['6','?','3','+','2'],target:20},{type:'signs',parts:['10','?','2',X,'4'],target:2},{type:'signs',parts:['5','?','(','4','?','2',')'],target:30},
]},
{n:5,c:'var(--s)',title:'Del enunciado a la operación',sub:'Convierte una historia en números',items:[
 {type:'theory',kind:'Estrategia',title:'Cinco pasos',html:`<ol class="steps5">
 <li><span><b>Leo dos veces.</b> La primera, para entender la historia; la segunda, para ver qué me preguntan.</span></li>
 <li><span><b>Subrayo los datos.</b> Cada número con su «nombre»: <i>3 cajas</i>, <i>6 lápices en cada caja</i>.</span></li>
 <li><span><b>Busco las palabras pista.</b> Me dicen qué operación hay escondida.</span></li>
 <li><span><b>Escribo la operación por trocitos</b> y después lo junto todo en una sola operación combinada.</span></li>
 <li><span><b>Resuelvo y compruebo.</b> Hago el arbolito, miro si tiene sentido y respondo con una frase.</span></li></ol>`},
 {type:'theory',kind:'Estrategia',title:'Palabras pista',html:`<div class="pistas">
 <div style="background:var(--x-bg)"><div class="sym cx">×</div>en cada, cada uno, de … cada uno, veces, iguales</div>
 <div style="background:var(--s-bg)"><div class="sym cs">+</div>en total, más, añade, junta, suben, gana</div>
 <div style="background:var(--s-bg)"><div class="sym cs">−</div>quedan, gasta, regala, pierde, bajan, sobra</div></div>
 <p class="note" style="border-color:var(--blue);background:var(--blue-bg)">Las pistas ayudan, pero siempre hay que pensar qué está pasando en la historia.</p>`},

/* ---------- helpers ---------- */
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild}
function fb(box,cls,html){box.className='fb show '+cls;box.innerHTML=html}
/* pixel art */
const PAL={G:'#3fae4a',g:'#2b7d34',L:'#7fd36b',T:'#8a5a2b',t:'#5e3b1a',Y:'#f2b705',W:'#fff3b0',O:'#c27c00',K:'#6b778d',k:'#1d2a44',S:'#a3adbd',w:'#e6ebf2'};
const TREE=['......GGGG......','....GGLLGGGG....','...GGLLGGGgGG...','..GGLGGGGGGgGG..','..GGGGGgGGGGGG..','.GGgGGGGGGLGGgG.','.GGGGGGgGGGGGGG.','..GgGGGGGGGgGG..','...GGGGTTGGGG...','.....gGTTGg.....','.......TT.......','.......TT.......','.......Tt.......','......TTtt......','.....TTTttt.....'];
const GEM=['..YYYY..','.YWWYYO.','YWWYYYYO','YYYYYYOO','.YYYYOO.','..YYOO..','...YO...'];
const GEM0=GEM.map(r=>r.replace(/[YW]/g,'S').replace(/O/g,'K'));
const LOCK=['..kkkk..','.k....k.','.k....k.','kkkkkkkk','kwwwwwwk','kwwkkwwk','kwwkkwwk','kwwwwwwk','kkkkkkkk'];
function pix(art,pal,cls){const h=art.length,w=art[0].length;let r='';
  art.forEach((row,y)=>[...row].forEach((ch,x)=>{if(pal[ch])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`}));
  return `<svg class="pix ${cls||''}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${r}</svg>`}
function stars(n){return `<span class="gems" role="img" aria-label="${n} de 3 gemas">${[0,1,2].map(i=>pix(i<n?GEM:GEM0,PAL)).join('')}</span>`}

/* ---------- tree component ---------- */
function Tree(expr,{mode='solve',onDone}={}){
  const root=el(`<div><div class="treebox"><div class="tree"><svg class="lines"></svg></div></div><div class="ask"></div><div class="fb"></div></div>`);
  const tree=root.querySelector('.tree'),svg=root.querySelector('svg'),ask=root.querySelector('.ask'),fbx=root.querySelector('.fb');
  let t=tok(expr);const links=[];let rows=[];let errors=0;let finished=false;
  function rowEl(tokens,interactive){
    const r=document.createElement('div');r.className='trow';
    tokens.forEach((k,i)=>{let s;
      if(interactive&&isOp(k)){s=document.createElement('button');s.type='button';s.setAttribute('aria-label','Operación '+k);s.addEventListener('click',()=>pick(i,s))}
      else s=document.createElement('span');
      s.className='tk'+((k==='('||k===')')?' par':'');if(k==='('||k===')')s.style.color='var(--p)';
      s.textContent=k;r.appendChild(s)});
    return r}
  function addRow(tokens,interactive,link){
    rows.forEach(r=>r.querySelectorAll('button.tk').forEach(b=>{const s=document.createElement('span');s.className=b.className;s.textContent=b.textContent;s.style.cssText=b.style.cssText;s.className=s.className.replace('shake','');b.replaceWith(s)}));
    const r=rowEl(tokens,interactive);tree.appendChild(r);rows.push(r);
    if(link){links.push(link);const res=r.children[link.ri];res.classList.add('res-'+link.kind);align(r,link)}
    requestAnimationFrame(draw)}
  function centerX(node){const a=node.getBoundingClientRect(),b=tree.getBoundingClientRect();return a.left-b.left+a.width/2}
  function align(r,link){
    const prev=rows[rows.length-2];const target=(centerX(prev.children[link.a])+centerX(prev.children[link.b]))/2;
    const now=centerX(r.children[link.ri]);let dx=target-now;
    const rb=r.getBoundingClientRect(),tb=tree.getBoundingClientRect();
    const minDx=tb.left-rb.left+4, maxDx=tb.right-rb.right-4; // keep inside
    // compute row content extents
    const first=r.children[0].getBoundingClientRect(),last=r.children[r.children.length-1].getBoundingClientRect();
    dx=Math.max(tb.left-first.left+4,Math.min(tb.right-last.right-4,dx));
    r.style.transform=`translateX(${dx}px)`}
  function draw(){
    const tb=tree.getBoundingClientRect();svg.setAttribute('width',tb.width);svg.setAttribute('height',tb.height);
    svg.innerHTML='';
    links.forEach((L,idx)=>{const up=rows[idx],down=rows[idx+1];if(!up||!down)return;
      const A=up.children[L.a].getBoundingClientRect(),B=up.children[L.b].getBoundingClientRect(),R=down.children[L.ri].getBoundingClientRect();
      const y1=A.bottom-tb.top+3,y2=R.top-tb.top-3,ax=A.left-tb.left+A.width/2,bx=B.left-tb.left+B.width/2,rx=R.left-tb.left+R.width/2;
      [[ax,rx-7],[bx,rx+7]].forEach(([x1,x2])=>{const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);
        ln.setAttribute('stroke',getComputedStyle(document.documentElement).getPropertyValue('--'+L.kind));ln.setAttribute('stroke-width','4');ln.setAttribute('stroke-linecap','square');svg.appendChild(ln)})})}
  window.addEventListener('resize',()=>requestAnimationFrame(draw));
  function hint(j,n){
    if(n.inP&&(j<n.lo||j>n.hi))return 'Hay un <b class="cp">paréntesis</b>: empieza por lo que hay dentro.';
    if(t[n.i]===X&&t[j]!==X)return 'Fíjate: hay una <b class="cx">multiplicación</b>. Va antes que las sumas y las restas.';
    if(t[n.i]===X&&t[j]===X)return 'Hay más de una multiplicación: empieza por la de la <b>izquierda</b>.';
    return 'Sumas y restas: de <b>izquierda a derecha</b>. ¿Cuál está más a la izquierda?'}
  let cur=null;
  function pick(j,btn){
    if(finished||cur)return;const n=nextOp(t);
    if(j!==n.i){errors++;btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');fb(fbx,'tip',hint(j,n));return}
    const r=rows[rows.length-1];[n.i-1,n.i,n.i+1].forEach(k=>r.children[k].classList.add('on-'+n.kind));
    if(mode==='first'){finished=true;fb(fbx,'ok',`¡Muy bien! ${n.inP?'Primero lo que hay dentro del paréntesis.':t[n.i]===X?'La multiplicación va antes.':'Sumas y restas, de izquierda a derecha.'}`);onDone&&onDone(errors===0);return}
    cur=n;fbx.className='fb';
    const a=t[n.i-1],op=t[n.i],b=t[n.i+1];
    ask.innerHTML='';const lab=el(`<span class="f">${a} ${op} ${b} =</span>`);
    const inp=el(`<input class="num" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Resultado de ${a} ${op} ${b}">`);
    const go=el(`<button class="btn" type="button">Comprobar</button>`);ask.append(lab,inp,go);inp.focus({preventScroll:true});
    let tries=0;
    const check=()=>{const v=calc(a,op,b);if(inp.value.trim()==='')return;
      if(+inp.value===v)advance();
      else{tries++;errors++;if(tries<2){fb(fbx,'bad',`Casi. Vuelve a calcular <b>${a} ${op} ${b}</b>.`);inp.select()}
        else{fb(fbx,'tip',`${a} ${op} ${b} = <b>${v}</b>. ¡Sigamos!`);setTimeout(advance,900)}}};
    go.addEventListener('click',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  }
  function advance(){
    const n=cur;cur=null;ask.innerHTML='';
    const {nt,ri}=apply(t,n.i);t=nt;
    addRow(t,t.length>1&&mode==='solve',{a:n.i-1,b:n.i+1,ri,kind:n.kind});
    if(t.length===1){finished=true;
      if(mode==='solve'){fb(fbx,'ok',errors===0?`¡Perfecto! El resultado es <b>${t[0]}</b>. 🌳`:`¡Conseguido! El resultado es <b>${t[0]}</b>.`);onDone&&onDone(errors===0,+t[0])}
      else onDone&&onDone(true,+t[0])}
    else if(mode==='solve')fbx.className='fb';
  }
  // demo stepping
  root.step=function(){if(t.length===1)return false;cur=nextOp(t);const r=rows[rows.length-1];[cur.i-1,cur.i,cur.i+1].forEach(k=>r.children[k].classList.add('on-'+cur.kind));advance();return t.length>1};
  addRow(t,mode!=='demo',null);
  return root}

/* ---------- item renderers ---------- */
function render(item,done){
  const c=el(`<div class="card"></div>`);
  if(item.type==='theory'){c.innerHTML=`<span class="kind">${item.kind}</span><h3>${item.title}</h3>${item.html}`;done(null);return c}
  if(item.type==='demo'){c.innerHTML=`<span class="kind">Ejemplo</span><h3>${item.title}</h3><p class="q">${item.text}</p>`;
    const tr=Tree(item.expr,{mode:'demo',onDone:()=>{}});c.appendChild(tr);
    const nav=el(`<div class="navrow" style="justify-content:center"><button class="btn ghost" type="button">Siguiente paso ▸</button></div>`);c.appendChild(nav);
    const b=nav.querySelector('button');b.addEventListener('click',()=>{const more=tr.step();if(!more){b.disabled=true;b.textContent='¡Terminado!';done(null)}});
    return c}
  if(item.type==='firstop'){c.innerHTML=`<span class="kind">¿Qué va primero?</span><h3>Toca la operación que harías primero</h3>`;c.appendChild(Tree(item.expr,{mode:'first',onDone:ok=>done(ok)}));return c}
  if(item.type==='tree'){c.innerHTML=`<span class="kind">Arbolito</span><h3>Resuelve paso a paso</h3><p class="q">Toca la operación que va primero y escribe su resultado.</p>`;c.appendChild(Tree(item.expr,{onDone:ok=>done(ok)}));return c}
  if(item.type==='vf'){
    const [lhs,rhs]=item.claim.split(' = ');const real=evalS(lhs);const truth=real===+rhs;
    c.innerHTML=`<span class="kind">Verdadero o falso</span><h3>¿Está bien resuelta?</h3><div class="bigexpr">${color(lhs)} = ${rhs}</div><div class="vf"><button class="btn ghost" data-v="1" type="button">Verdadero</button><button class="btn ghost" data-v="0" type="button">Falso</button></div><div class="fb"></div>`;
    const box=c.querySelector('.fb');let answered=false;
    c.querySelectorAll('.vf button').forEach(b=>b.addEventListener('click',()=>{if(answered)return;answered=true;
      const ok=(b.dataset.v==='1')===truth;b.style.borderColor=ok?'var(--s)':'var(--red)';
      fb(box,ok?'ok':'bad',`${ok?'¡Correcto!':'¡Uy! No es así.'} ${truth?'Es verdadero':'Es falso'}: ${stepsText(lhs)}.`);done(ok)}));
    return c}
  if(item.type==='paren'){
    const t=tok(item.expr);let sel=[];let firstTry=true;let solved=false;
    c.innerHTML=`<span class="kind">Coloca los paréntesis</span><h3>Haz que la igualdad sea cierta</h3><p class="q">Toca el número donde <b>empieza</b> el paréntesis y después el número donde <b>termina</b>.</p><div class="bigexpr ex"></div><div class="navrow" style="justify-content:center"><button class="btn ghost" type="button">Borrar</button></div><div class="fb"></div>`;
    const ex=c.querySelector('.ex'),box=c.querySelector('.fb'),clr=c.querySelector('.navrow button');
    function draw(){ex.innerHTML='';t.forEach((k,i)=>{
        if(sel.length===2&&i===sel[0])ex.append(el('<span class="pp">(</span>'));
        if(isOp(k))ex.append(el(`<span class="ptok">${k}</span>`));
        else{const b=el(`<button class="ptok${sel.includes(i)?' sel':''}" type="button">${k}</button>`);b.addEventListener('click',()=>tap(i));ex.append(b)}
        if(sel.length===2&&i===sel[1])ex.append(el('<span class="pp">)</span>'))});
      ex.append(el(`<span class="ptok">= ${item.target}</span>`))}
    function tap(i){if(solved)return;
      if(sel.length===2)sel=[];sel.push(i);sel.sort((a,b)=>a-b);
      if(sel.length===2&&sel[0]===sel[1])sel=[sel[0]];
      draw();if(sel.length===2){const nt=t.slice(0,sel[0]).concat(['('],t.slice(sel[0],sel[1]+1),[')'],t.slice(sel[1]+1));
        const v=evalT(nt);const s=nice(nt.join(' '));
        if(v===item.target){solved=true;fb(box,'ok',`¡Muy bien! ${stepsText(s)}.`);done(firstTry)}
        else{firstTry=false;fb(box,'bad',`Con esos paréntesis da <b>${v}</b>, no ${item.target}. Prueba otra vez.`)}}}
    clr.addEventListener('click',()=>{if(solved)return;sel=[];draw();box.className='fb'});
    draw();return c}
  if(item.type==='signs'){
    const parts=item.parts.slice();const cyc=['+',M,X];let firstTry=true;let solved=false;
    c.innerHTML=`<span class="kind">Completa los signos</span><h3>Elige +, − o ×</h3><p class="q">Toca cada casilla para cambiar el signo.</p><div class="bigexpr ex"></div><div class="navrow" style="justify-content:center"><button class="btn" type="button">Comprobar</button></div><div class="fb"></div>`;
    const ex=c.querySelector('.ex'),box=c.querySelector('.fb'),go=c.querySelector('.navrow button');
    function draw(){ex.innerHTML='';parts.forEach((k,i)=>{
        if(item.parts[i]==='?'){const b=el(`<button class="slot${k==='?'?' empty':''}" type="button" aria-label="Elegir signo">${k==='?'?'?':k}</button>`);
          b.addEventListener('click',()=>{if(solved)return;parts[i]=k==='?'?cyc[0]:cyc[(cyc.indexOf(k)+1)%3];draw()});ex.append(b)}
        else ex.append(el(`<span class="ptok"${k==='('||k===')'?' style="color:var(--p)"':''}>${k}</span>`))});
      ex.append(el(`<span class="ptok">= ${item.target}</span>`))}
    go.addEventListener('click',()=>{if(solved)return;if(parts.includes('?')){fb(box,'tip','Completa todas las casillas.');return}
      const s=parts.join(' ');const v=evalS(s);
      if(v===item.target){solved=true;fb(box,'ok',`¡Correcto! ${stepsText(s)}.`);go.disabled=true;done(firstTry)}
      else{firstTry=false;fb(box,'bad',`Así da <b>${v}</b>. Recuerda el orden: primero paréntesis, después ×. Prueba otra combinación.`)}});
    draw();return c}
  if(item.type==='mc'||item.type==='prob'){
    c.innerHTML=`<span class="kind">${item.type==='prob'?'Problema':'¿Qué operación es?'}</span><h3>Elige la operación combinada</h3><p class="q">${item.q}</p><div class="choice"></div><div class="fb"></div><div class="after"></div>`;
    const ch=c.querySelector('.choice'),box=c.querySelector('.fb'),after=c.querySelector('.after');let firstTry=true,solved=false;
    item.opts.forEach((o,i)=>{const b=el(`<button type="button">${color(o)}</button>`);ch.append(b);
      b.addEventListener('click',()=>{if(solved||b.classList.contains('wrong'))return;
        if(i===item.a){solved=true;b.classList.add('right');
          if(item.type==='mc'){fb(box,'ok',`¡Eso es! ${stepsText(o)}.`);done(firstTry)}
          else{fb(box,'ok','¡Bien elegida! Ahora resuélvela con el arbolito.');
            after.appendChild(Tree(o,{onDone:(ok,v)=>{after.appendChild(el(`<div class="fb show ok"><b>Respuesta:</b> ${v} ${item.unit}.</div>`));done(firstTry&&ok)}}))}}
        else{firstTry=false;b.classList.add('wrong');fb(box,'bad',item.why[i]||'Esa no es. Vuelve a leer el problema.')}})});
    return c}
  if(item.type==='pista'){
    c.innerHTML=`<span class="kind">Palabras pista</span><h3>${item.title}</h3><p class="q">Toca las palabras que te dan pistas sobre las operaciones.</p><p class="sentence"></p><div class="navrow" style="justify-content:center"><button class="btn" type="button">Comprobar</button></div><div class="fb"></div>`;
    const sen=c.querySelector('.sentence'),box=c.querySelector('.fb'),go=c.querySelector('.navrow button');let firstTry=true,solved=false;const btns=[];
    item.chunks.forEach(([txt,isP])=>{txt.split(' ').forEach((w,wi,arr)=>{});
      if(isP){const b=el(`<button type="button">${txt}</button>`);b.dataset.p='1';b.addEventListener('click',()=>{if(!solved)b.classList.toggle('sel')});btns.push(b);sen.append(b,' ')}
      else txt.split(' ').forEach(w=>{if(/[a-záéíóúñ]{3,}/i.test(w)&&!/^\d/.test(w)){const b=el(`<button type="button">${w}</button>`);b.addEventListener('click',()=>{if(!solved)b.classList.toggle('sel')});btns.push(b);sen.append(b,' ')}else sen.append(w+' ')})});
    go.addEventListener('click',()=>{if(solved)return;const miss=btns.filter(b=>b.dataset.p&&!b.classList.contains('sel')),extra=btns.filter(b=>!b.dataset.p&&b.classList.contains('sel'));
      if(!miss.length&&!extra.length){solved=true;go.disabled=true;fb(box,'ok',`¡Muy bien! <b class="cx">en cada</b> → multiplicar · <b class="cs">regala</b> y <b class="cs">quedan</b> → restar.<br>${item.after}`);done(firstTry)}
      else{firstTry=false;extra.forEach(b=>{b.classList.add('miss');setTimeout(()=>b.classList.remove('miss'),900)});
        fb(box,'bad',miss.length?`Te falta${miss.length>1?'n':''} ${miss.length} pista${miss.length>1?'s':''}. ${extra.length?'Y alguna de las marcadas no es pista.':''}`:'Alguna de las palabras marcadas no es una pista.')}});
    return c}
  if(item.type==='self'){
    c.innerHTML=`<span class="kind">Para terminar</span><h3>¿Cómo me ha ido?</h3><div class="faces"></div>`;
    const f=c.querySelector('.faces');[['😃','Sé el orden y sé convertir un problema en una operación.'],['🙂','Calculo bien, pero me cuesta escribir la operación del problema.'],['🤔','Necesito practicar un poco más.']].forEach(([e,t])=>{
      const b=el(`<button type="button"><span class="em">${e}</span>${t}</button>`);b.addEventListener('click',()=>{f.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');done(null)});f.append(b)});
    return c}
  return c}

/* ---------- screens ---------- */
function home(){
  const done=Object.keys(state.stars).length;
  app.innerHTML='';
  app.append(el(`<div class="hero"><div class="titlebox"><div class="k">Repaso · 4.º de Primaria</div><h1 style="margin-bottom:0">Operaciones combinadas y problemas</h1></div>${pix(TREE,PAL,'ptree')}
  <p>Siete niveles para repasar el orden de las operaciones, resolver con el arbolito y convertir problemas en operaciones.</p>
  <div class="eq"><p>Hay 3 bolsas. En cada bolsa hay 5 canicas rojas y 2 azules.</p><div class="big">${color(`3 ${X} (5 + 2)`)} = ?</div></div></div>`));
  app.append(el(`<details class="fam"><summary>Información para las familias</summary>
  <p>Este repaso sigue el cuaderno trabajado en clase. Los niveles se desbloquean en orden; cada uno dura entre 5 y 10 minutos.</p>
  <ul><li>Si se equivocan, la página da una pista en lugar de la solución. Dejad que lo intenten.</li><li>El «arbolito» es la técnica de clase: en cada fila se resuelve una sola operación.</li><li>No se guarda ningún dato personal. El progreso solo se recuerda en este dispositivo.</li></ul></details>`));
  const path=el(`<div class="path"></div>`);
  LEVELS.forEach(L=>{const locked=L.n>state.unlocked;const s=state.stars[L.n];
    const b=el(`<button class="lv${locked?' locked':''}" type="button"${locked?' aria-disabled="true"':''}>
      <span class="dot" style="background:${locked?'var(--soft)':L.c}">${locked?pix(LOCK,PAL,'lk'):L.n}</span>
      <span class="info"><b>${L.title}</b><span>${L.sub}</span></span>
      <span class="stars">${s?stars(s):''}</span></button>`);
    if(!locked)b.addEventListener('click',()=>level(L));path.append(b)});
  app.append(path);
  app.append(el(`<p class="foot">${done}/${LEVELS.length} niveles completados</p>`));
  const r=el(`<div style="text-align:center"><button class="reset" type="button">Empezar de nuevo</button></div>`);
  r.querySelector('button').addEventListener('click',()=>{if(confirm('¿Borrar el progreso de este dispositivo?')){state={unlocked:1,stars:{}};save();home()}});
  app.append(r);window.scrollTo(0,0)}

function level(L){
  let idx=0,graded=0,correct=0;
  app.innerHTML='';
  const top=el(`<div class="top"><button class="back" type="button" aria-label="Volver al mapa">←</button><div class="ttl"><small>Nivel ${L.n}</small><h2>${L.title}</h2><div class="bar"><i style="width:0%"></i></div></div></div>`);
  top.querySelector('.back').addEventListener('click',home);app.append(top);
  const stage=el(`<div></div>`);app.append(stage);
  const bar=top.querySelector('.bar i');
  function show(){
    bar.style.width=(idx/L.items.length*100)+'%';stage.innerHTML='';
    if(idx>=L.items.length)return finish();
    const item=L.items[idx];
    const nav=el(`<div class="navrow"><button class="btn" type="button" disabled>${idx===L.items.length-1?'Terminar':'Siguiente'} ▸</button></div>`);
    const nb=nav.querySelector('button');
    const card=render(item,(ok)=>{if(ok!==null&&!card._g){card._g=1;graded++;if(ok)correct++}nb.disabled=false});
    card.classList.add('pop');stage.append(card,nav);
    nb.addEventListener('click',()=>{idx++;show();window.scrollTo({top:0,behavior:'smooth'})});
    if(item.type==='theory')nb.disabled=false}
  function finish(){
    const pct=graded?correct/graded:1;const st=pct>=.9?3:pct>=.6?2:1;
    state.stars[L.n]=Math.max(state.stars[L.n]||0,st);state.unlocked=Math.max(state.unlocked,Math.min(L.n+1,LEVELS.length));save();
    const last=L.n===LEVELS.length;
    const c=el(`<div class="card end pop"><h3>${last?'¡Repaso completado!':'¡Nivel superado!'}</h3><div class="st">${stars(st)}</div>
      <p>${graded?`Has acertado a la primera <b>${correct} de ${graded}</b> y ganas <b>${st} gema${st>1?'s':''}</b>.`:'¡Buen trabajo!'}</p>
      <p style="color:var(--soft);font-size:16px">${st===3?'¡Lo dominas!':st===2?'¡Muy bien! Repítelo para conseguir las 3 gemas.':'Repite el nivel con calma: las pistas te ayudarán.'}</p>
      <div class="navrow" style="justify-content:center;flex-wrap:wrap"><button class="btn ghost" data-a="map" type="button">Volver al mapa</button>${last?'':`<button class="btn" data-a="next" type="button">Siguiente nivel ▸</button>`}</div></div>`);
    c.querySelector('[data-a=map]').addEventListener('click',home);
    const nx=c.querySelector('[data-a=next]');if(nx)nx.addEventListener('click',()=>level(LEVELS[L.n]));
    stage.append(c);bar.style.width='100%'}
  show();window.scrollTo(0,0)}

home();
})();
</script>
</body>
</html>
